<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: contain; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-family: sans-serif; }
        #error { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #f44; font-size: 16px; font-family: sans-serif; text-align: center; display: none; padding: 20px; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="loading">加载中...</div>
    <div id="error"></div>
    <script src="hls.min.js"></script>
    <script>
        var video = document.getElementById('video');
        var loading = document.getElementById('loading');
        var errorEl = document.getElementById('error');
        var url = decodeURIComponent(location.hash.substring(1));

        function showError(msg) {
            loading.style.display = 'none';
            errorEl.style.display = 'block';
            errorEl.textContent = msg;
        }

        console.log('URL: ' + url);
        console.log('Hls loaded: ' + (typeof Hls !== 'undefined'));

        if (!url) {
            showError('播放地址为空');
        } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            // 强制使用 hls.js，不走原生（Android WebView 原生 HLS 不稳定）
            console.log('Using hls.js');
            var hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log('Manifest parsed, playing');
                loading.style.display = 'none';
                video.play();
            });
            hls.on(Hls.Events.ERROR, function(event, data) {
                console.log('HLS error: ' + data.type + ' ' + data.details);
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log('Network error, retrying...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log('Media error, recovering...');
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            showError('播放失败: ' + data.type + ' ' + data.details);
                            break;
                    }
                }
            });
        } else if (typeof Hls === 'undefined') {
            showError('hls.js 未加载，无法播放 HLS 流');
        } else {
            // 最后尝试原生播放
            console.log('Trying native playback');
            video.src = url;
            video.play().catch(function(e) {
                showError('原生播放失败: ' + e.message);
            });
        }

        video.addEventListener('playing', function() {
            loading.style.display = 'none';
        });
    </script>
</body>
</html>
